<!DOCTYPE html>
<html>
    
<head>
    
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("{{ url_for('static', filename='images/loan1.avif') }}") no-repeat center center fixed;
            background-size: cover;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0px 6px 18px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 700;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #1f618d;
        }
        p {
            margin-top: 15px;
        }
        a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        a:hover {
            color: #1f618d;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2><i class="fas fa-user-lock"></i> Login</h2>
        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <p>New user? <a href="{{ url_for('signup') }}">Signup here</a></p>
    </div>
</body>
</html>
