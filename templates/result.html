<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background: url("{{ url_for('static', filename='images/loan2.jpg') }}") no-repeat center center fixed;
        }
        .result-box {
            background: #fff;
            padding: 20px;
            margin: auto;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #aaa;
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            margin: 10px 0;
        }
        strong {
            color: #27ae60;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
        }
        a:hover {
            color: #1f618d;
        }
    </style>
</head>
<body class="confirmation-bg">
    <div class="result-box">
        <h2>Loan Prediction Result</h2>
        <p>Result: <strong>{{ result }}</strong></p>
        <p>Confidence: {{ confidence }}</p>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body
